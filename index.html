<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Registro de clientes</title>
<script defer src="jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f4f4f5;--card:#ffffff;--text:#111114;--muted:#5f5f68;--line:#e4e4e7;
  --accent:#D40009;--accent-soft:#fde8e9;--on-accent:#ffffff;
  --danger:#a8231c;--warn-bg:#fff1dc;--warn-tx:#7a4300;--good:#12803a;
  --disp:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--card:#0F0F11;--text:#ffffff;--muted:#A1A1AA;--line:#232327;
    --accent:#F0010A;--accent-soft:#2a0709;--on-accent:#ffffff;
    --danger:#ff8a80;--warn-bg:#3a2a10;--warn-tx:#f9c27c;--good:#5fd68a;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--card:#0F0F11;--text:#ffffff;--muted:#A1A1AA;--line:#232327;
  --accent:#F0010A;--accent-soft:#2a0709;--on-accent:#ffffff;
  --danger:#ff8a80;--warn-bg:#3a2a10;--warn-tx:#f9c27c;--good:#5fd68a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom,0px))}
.wrap.full{padding-bottom:16px}
h1,h2,.t,.num{font-family:var(--disp);font-weight:800;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.05;margin:0}
h2{font-size:22px;margin:0 0 12px}
.t{font-size:19px;line-height:1.15}
.m{color:var(--muted);font-size:14px}
.grow{flex:1;min-width:0}
.center{text-align:center}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.top h1{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
.toplogo{height:34px;width:auto;border-radius:8px;background:#000;flex:none}
.btn.sm{min-height:38px;padding:0 14px;font-size:15px}
.btn.full{width:100%}
.btn.big{min-height:54px;font-size:18px;width:100%;margin:6px 0 14px}
.linkbtn{color:var(--danger);font-weight:600;padding:12px 0;width:100%;text-align:center}
.x{width:38px;height:38px;border-radius:10px;color:var(--muted);font-size:22px;line-height:1;flex:none}
.x:active{background:var(--line)}

.input{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:16px}
textarea.input{resize:vertical}
select.input{appearance:none}
label{display:block;margin:0 0 12px;font-size:14px;color:var(--muted)}
label .input{margin-top:4px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:0 0 10px}
button.card{width:100%;text-align:left}
.row{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:17px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:64px;height:64px;font-size:22px}
.r{text-align:right;flex:none}
.banner{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--text);margin:0 0 12px}
.banner.warn{background:var(--warn-bg);color:var(--warn-tx)}
.banner span{font-weight:600;flex:none}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:2px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));min-height:54px;padding:0 22px;border-radius:27px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:17px;box-shadow:0 6px 18px rgba(13,27,42,.28);z-index:8}

.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin:0 0 12px;overflow-x:auto}
.tabs button{flex:1;min-height:40px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;padding:0 8px}
.tabs button.on{background:var(--card);color:var(--text)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.seg button{min-height:36px;padding:0 12px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:14px}
.seg button.on{background:var(--accent);color:var(--on-accent);box-shadow:none}

details.card summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
details .body{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.exl{margin:0 0 8px}.exl b{display:block}

.sess .center{cursor:pointer}
.sess .t{font-size:21px}
.exh{display:flex;align-items:center;gap:8px}
.exh .t{flex:1}
.prev{margin:2px 0 10px}
.sethead,.set{display:grid;grid-template-columns:26px 1fr 1fr 1fr 38px;gap:8px;align-items:center}
.sethead{font-size:13px;color:var(--muted);margin-bottom:4px}
.sethead span{text-align:center}
.set{margin-bottom:8px}
.set .n{font-family:var(--disp);font-weight:800;font-size:20px;color:var(--muted);text-align:center}
.set .input{text-align:center;font-family:var(--disp);font-weight:800;font-size:23px;min-height:50px;padding:4px}
.set .input::placeholder{color:var(--muted);opacity:.55;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.chips button{min-height:36px;padding:0 12px;border-radius:18px;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:600}
.chips button.on{background:var(--accent);color:var(--on-accent)}
.setcard{margin:0 0 10px}
.setrow{display:flex;align-items:center;gap:6px}
.stepper{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.stp{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:19px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.stp:active{background:var(--accent);color:var(--on-accent)}
.sv{text-align:center;font-family:var(--disp);font-weight:800;font-size:19px;min-height:40px;padding:2px;width:100%}
.add{display:flex;gap:8px}
.add .input{flex:1}
.mic{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:46px;min-height:46px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:19px}
.mic.on{background:var(--danger);color:#fff;box-shadow:none;animation:micpulse 1.1s ease-in-out infinite}
@keyframes micpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}

.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--card);stroke:var(--accent);stroke-width:2}
.chart .val{fill:var(--text);font-size:13px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.stats div{text-align:center}
.stats .num{font-size:22px;display:block}
.stats .m{font-size:12px}
.up{color:var(--good)}.down{color:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin:6px 0}
.btns .btn{flex:1}

.ov{position:fixed;inset:0;background:rgba(6,12,24,.55);display:flex;align-items:flex-end;z-index:50}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet p{margin:0 0 14px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:22px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90%;text-align:center}
#toast.on{opacity:1}

.dash{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.dash .card{margin:0;text-align:center}
.dash .num{font-size:26px;display:block}
.dash .m{font-size:12px}
.sem{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:12px}
.sem.g{background:#12803a1a;color:var(--good)}
.sem.r{background:#c0322b1a;color:var(--danger)}
.sem.b{background:#F0010A1a;color:var(--accent)}
.sem.y{background:#8a6d001a;color:#8a6d00}
.sem.n{background:var(--line);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.g{background:var(--good)}.dot.r{background:var(--danger)}.dot.b{background:var(--accent)}.dot.y{background:#c9951c}.dot.n{background:var(--muted)}
.soon{color:var(--muted);font-size:13px;margin-top:2px}
.prevnote{background:var(--accent-soft);color:var(--text);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px;line-height:1.35}

.navbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);box-shadow:0 -1px 0 var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.navbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;color:var(--muted);font-size:11px;font-weight:600}
.navbar button.on{color:var(--accent)}
.navbar .ic{font-size:20px;line-height:1}
@font-face{font-family:'Montserrat';font-weight:400;font-display:swap;src:url(brand/montserrat-400.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:600;font-display:swap;src:url(brand/montserrat-600.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:700;font-display:swap;src:url(brand/montserrat-700.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:800;font-display:swap;src:url(brand/montserrat-800.woff2) format('woff2')}
.rp{position:fixed;inset:0;z-index:45;background:#000;color:#fff;font-family:'Montserrat',system-ui,sans-serif;display:flex;flex-direction:column}
.rp *{box-sizing:border-box}
.rp button{font-family:inherit;color:inherit;border:0;cursor:pointer}
.rp-bar{flex:none;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid #232327;background:#000}
.rp-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rp-top>img{height:36px;width:auto;display:block}
.rp-acts{display:flex;align-items:center;gap:8px}
.rp-pdf{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #F0010A!important;background:transparent;font-size:13px;font-weight:600;letter-spacing:.03em}
.rp-pdf.big{margin-top:22px;min-height:50px;padding:0 24px;font-size:14px}
.rp-x{width:44px;height:44px;border-radius:22px;background:#18181B;font-size:26px;line-height:1}
.rp-tabs{display:flex;gap:6px}
.rp-tabs button{flex:1;min-height:40px;border-radius:20px;background:#0F0F11;border:1px solid #232327!important;font-size:13px;font-weight:600;color:#A1A1AA}
.rp-tabs button.on{background:#F0010A;border-color:#F0010A!important;color:#fff}
.rp-body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:24px 20px calc(36px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:24px}
.rp-body.pres{padding:0;overflow:hidden;gap:0}
.rp-head{display:flex;flex-direction:column;gap:12px}
.rp h1{font-family:'Montserrat',system-ui,sans-serif;color:#fff}
.rp-body>*{flex-shrink:0}
.rp-slide>*:not(.push){flex-shrink:0}
.rp-eyebrow{font-size:12px;font-weight:600;letter-spacing:.3em;color:#F0010A}
.rp-eyebrow.w{color:#fff;letter-spacing:.22em;font-weight:700}
.rp-h1{margin:0;font-size:38px;line-height:1.05;font-weight:800;letter-spacing:-.01em;word-break:break-word}
.rp-sub{font-size:14px;color:#A1A1AA;line-height:1.6}
.rp-sub i{display:inline-block;width:4px;height:4px;border-radius:2px;background:#F0010A;margin:0 10px;vertical-align:middle}
.rp-sub .g{color:#A1A1AA}
.rp-rule{height:1px;margin-top:4px;background:linear-gradient(90deg,#F0010A 0,#F0010A 72px,#232327 72px)}
.rp-sec{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-bottom:-10px}
.rp-sec span{width:3px;height:14px;background:#F0010A;flex:none}
.rp-tiles{display:grid;gap:10px}
.rp-tiles.n1{grid-template-columns:1fr}.rp-tiles.n2{grid-template-columns:repeat(2,minmax(0,1fr))}.rp-tiles.n3,.rp-tiles.n4{grid-template-columns:repeat(3,minmax(0,1fr))}
.rp-tile{background:#0F0F11;border:1px solid #232327;border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rp-tile .l{font-size:11px;font-weight:600;letter-spacing:.14em;color:#A1A1AA}
.rp-tile .v{font-size:28px;font-weight:800;line-height:1}
.rp-tile .v small{font-size:13px;font-weight:600;color:#A1A1AA}
.rp-tile .d{font-size:13px;font-weight:700}
.rp-tile .d.r{color:#FF3B43}.rp-tile .d.w{color:#fff}.rp-tile .d.n{color:#A1A1AA;font-weight:500;font-size:12px}
.rp-card{background:#0F0F11;border:1px solid #232327;border-radius:20px;padding:18px 16px 14px;display:flex;flex-direction:column;gap:10px}
.rp-cardh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rp-cardh b{font-size:12px;font-weight:700;letter-spacing:.2em}
.rp-cardh b.red{color:#F0010A}
.rp-cardh span{font-size:12px;color:#A1A1AA}
.rp-cardh em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.12em;border:1px solid #F0010A;color:#F0010A;border-radius:12px;padding:5px 10px}
.rp-xl{display:flex;justify-content:space-between;font-size:11px;color:#A1A1AA}
.rp-p{margin:0;font-size:15px;line-height:1.55;color:#E4E4E7}
.rp-note{font-size:12px;color:#A1A1AA;line-height:1.5}
.rp-starn{font-size:20px;font-weight:700}
.rp-big{font-size:38px;font-weight:800;line-height:1}
.rp-big small{font-size:15px;font-weight:600;color:#A1A1AA}
.rp-big i,.rp-big2 i,.rp-v i{font-style:normal;color:#F0010A}
.rp-list{background:#0F0F11;border:1px solid #232327;border-radius:20px;padding:4px 16px}
.rp-li{padding:14px 0;border-bottom:1px solid #232327;display:flex;flex-direction:column;gap:8px}
.rp-li:last-child{border-bottom:0}
.rp-lr{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rp-lr .n{font-size:15px;font-weight:600;min-width:0}
.rp-lr .v{font-size:14px;color:#A1A1AA;white-space:nowrap}
.rp-lr .v b{color:#fff;font-weight:700}
.rp-lr .v b.r{color:#FF3B43;margin-left:6px}
.rp-lr .v b.w{color:#fff;margin-left:6px}
.rp-lr .v i{font-style:normal;color:#F0010A}
.rp-pb{height:5px;border-radius:3px;background:#232327}
.rp-pb div{height:5px;border-radius:3px}
.rp-pb .r{background:#F0010A}.rp-pb .w{background:#fff}
.rp-recs{display:flex;flex-direction:column;gap:10px}
.rp-rec{display:flex;align-items:center;gap:14px;background:#0F0F11;border:1px solid #232327;border-radius:16px;padding:14px 16px}
.rp-rec .ic{width:40px;height:40px;border-radius:20px;background:#F0010A;display:flex;align-items:center;justify-content:center;flex:none}
.rp-rec div{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.rp-rec b{font-size:15px;font-weight:700}
.rp-rec span{font-size:12px;color:#A1A1AA}
.rp-rec.s{padding:12px 14px;gap:12px;border-radius:14px}
.rp-rec.s .dt{width:10px;height:10px;border-radius:5px;background:#F0010A;flex:none}
.rp-rec.s b{font-size:14px;font-weight:600}
.rp-rec.s em{font-style:normal;font-weight:700;font-size:14px}
.rp-cmp{position:relative;aspect-ratio:3/4;border-radius:20px;overflow:hidden;background:#111114;border:1px solid #232327;max-height:70vh;width:100%}
.rp-cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.rp-cmp .bf{position:absolute;inset:0}
.rp-cmp .ln{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#F0010A;pointer-events:none}
.rp-cmp .kn{position:absolute;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:22px;background:#F0010A;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(0,0,0,.6);pointer-events:none}
.rp-cmp .rg{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;touch-action:pan-y;cursor:ew-resize}
.rp-cmp .tg{position:absolute;bottom:14px;font-size:11px;font-weight:700;letter-spacing:.14em;padding:6px 10px;border-radius:10px;pointer-events:none}
.rp-cmp .tg.l{left:14px;background:rgba(0,0,0,.72)}
.rp-cmp .tg.r{right:14px;background:#F0010A}
.rp-foot{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:6px;font-size:12px;color:#A1A1AA;text-align:center}
.rp-foot img{width:230px;max-width:70%;height:auto}
.rp-snap{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.rp-slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:24px 24px calc(64px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;position:relative;min-width:0}
.rp-slide .push{flex:1}
.rp-slide.cover .tri{position:absolute;top:0;right:0;width:62%;height:34%;background:#F0010A;clip-path:polygon(100% 0,100% 100%,0 0);pointer-events:none}
.rp-slide .mk{position:relative;height:44px;width:auto;align-self:flex-start}
.rp-huge{font-size:clamp(76px,28vw,120px);font-weight:800;line-height:.95;letter-spacing:-.03em}
.rp-huge small{font-size:clamp(26px,9vw,38px);font-weight:700;color:#A1A1AA;letter-spacing:0}
.rp-cap{font-size:22px;font-weight:700;line-height:1.25}
.rp-cap.sm{font-size:16px;font-weight:500;color:#A1A1AA}
.rp-hint{font-size:14px;color:#A1A1AA;line-height:1.5}
.rp-big2{font-size:clamp(44px,15vw,60px);font-weight:800;line-height:1;letter-spacing:-.02em}
.rp-big2 small{font-size:22px;color:#A1A1AA;font-weight:600}
.rp-pp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rp-pp.one{grid-template-columns:1fr}
.rp-pp>div{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:#111114;border:1px solid #232327}
.rp-pp>div.now{border-color:#F0010A}
.rp-pp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>
<div id="toast" role="status"></div>

<script>
'use strict';
const LS_KEY='registro_clientes_v1';
const DEFAULT_EX=[
 'Press banca con barra','Press inclinado con mancuernas','Press militar','Press en máquina de pecho','Fondos en paralelas','Elevaciones laterales','Extensión de tríceps en polea',
 'Jalón al pecho','Dominadas','Remo con barra','Remo en polea baja','Remo con mancuerna','Face pull','Curl de bíceps con barra',
 'Sentadilla','Prensa de pierna','Peso muerto rumano','Zancadas','Hip thrust','Curl femoral','Extensión de cuádriceps','Elevación de talones',
 'Plancha','Crunch en polea','Abducción de cadera','Farmer walk'
];
const RIR_VALUES=['0','1','2','3','4+'];
const RPE_VALUES=['6','7','8','9','10'];

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>isoOf(new Date());
const parseIso=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const fmtDate=iso=>parseIso(iso).toLocaleDateString('es-PE',{day:'numeric',month:'short'});
const fmtDateLong=iso=>parseIso(iso).toLocaleDateString('es-PE',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)?null:n};
const fmtNum=v=>Math.abs(v)>=100?String(Math.round(v)):String(Math.round(v*10)/10);
const initials=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(ss).padStart(2,'0')};
const empty=(t,s)=>`<div class="empty"><b>${esc(t)}</b>${s?esc(s):''}</div>`;
const daysSince=iso=>Math.floor((startOfToday()-parseIso(iso))/864e5);
function startOfToday(){const d=new Date();d.setHours(0,0,0,0);return d}
function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x}
function calcAge(bd){
  if(!bd)return null;
  const b=parseIso(bd),t=new Date();
  let a=t.getFullYear()-b.getFullYear();
  const m=t.getMonth()-b.getMonth();
  if(m<0||(m===0&&t.getDate()<b.getDate()))a--;
  return a>=0&&a<130?a:null;
}
function compressImage(file,maxW,cb){
  const img=new Image(),rd=new FileReader();
  rd.onload=()=>{img.onload=()=>{
    const scale=Math.min(1,maxW/img.width);
    const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    cb(cv.toDataURL('image/jpeg',0.72));
  };img.src=rd.result};
  rd.readAsDataURL(file);
}

/* ---------- fotos de progreso (IndexedDB) ---------- */
const PHOTO_DB_NAME='rc_photos_v1',PHOTO_STORE='photos';
let photoDBReady=null;
function openPhotoDB(){
  if(photoDBReady)return photoDBReady;
  photoDBReady=new Promise(resolve=>{
    if(!('indexedDB' in window)){resolve(null);return}
    let req;
    try{req=indexedDB.open(PHOTO_DB_NAME,1)}catch(e){resolve(null);return}
    req.onupgradeneeded=()=>{
      const d=req.result;
      if(!d.objectStoreNames.contains(PHOTO_STORE)){
        const st=d.createObjectStore(PHOTO_STORE,{keyPath:'id'});
        st.createIndex('byMeasure','measureId',{unique:false});
        st.createIndex('byClient','clientId',{unique:false});
      }
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>resolve(null);
  });
  return photoDBReady;
}
async function savePhoto(rec){
  const d=await openPhotoDB();if(!d)return false;
  return new Promise(res=>{
    try{
      const tx=d.transaction(PHOTO_STORE,'readwrite');
      tx.objectStore(PHOTO_STORE).put(rec);
      tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);
    }catch(e){res(false)}
  });
}
async function getPhotosByClient(cid){
  const d=await openPhotoDB();if(!d)return [];
  return new Promise(res=>{
    try{
      const tx=d.transaction(PHOTO_STORE,'readonly');
      const req=tx.objectStore(PHOTO_STORE).index('byClient').getAll(cid);
      req.onsuccess=()=>res(req.result||[]);req.onerror=()=>res([]);
    }catch(e){res([])}
  });
}
async function deletePhoto(id){
  const d=await openPhotoDB();if(!d)return;
  return new Promise(res=>{
    try{
      const tx=d.transaction(PHOTO_STORE,'readwrite');
      tx.objectStore(PHOTO_STORE).delete(id);
      tx.oncomplete=()=>res();tx.onerror=()=>res();
    }catch(e){res()}
  });
}
async function deletePhotosByClient(cid){
  const photos=await getPhotosByClient(cid);
  for(const p of photos)await deletePhoto(p.id);
}
async function getAllPhotos(){
  const d=await openPhotoDB();if(!d)return [];
  return new Promise(res=>{
    try{
      const tx=d.transaction(PHOTO_STORE,'readonly');
      const req=tx.objectStore(PHOTO_STORE).getAll();
      req.onsuccess=()=>res(req.result||[]);req.onerror=()=>res([]);
    }catch(e){res([])}
  });
}
async function clearAllPhotos(){
  const d=await openPhotoDB();if(!d)return;
  return new Promise(res=>{
    try{
      const tx=d.transaction(PHOTO_STORE,'readwrite');
      tx.objectStore(PHOTO_STORE).clear();
      tx.oncomplete=()=>res();tx.onerror=()=>res();
    }catch(e){res()}
  });
}
async function deletePhotosByMeasure(mid){
  const d=await openPhotoDB();if(!d)return;
  return new Promise(res=>{
    try{
      const tx=d.transaction(PHOTO_STORE,'readwrite');
      const req=tx.objectStore(PHOTO_STORE).index('byMeasure').getAllKeys(mid);
      req.onsuccess=()=>{const ids=req.result||[];const st=tx.objectStore(PHOTO_STORE);ids.forEach(id=>st.delete(id))};
      tx.oncomplete=()=>res();tx.onerror=()=>res();
    }catch(e){res()}
  });
}
let photoCache={};
function loadPhotosForClient(cid,force){
  if(!cid)return;
  if(photoCache[cid]&&photoCache[cid].loaded&&!force)return;
  getPhotosByClient(cid).then(photos=>{
    const byMeasure={};
    photos.forEach(p=>{(byMeasure[p.measureId]=byMeasure[p.measureId]||[]).push(p)});
    photoCache[cid]={loaded:true,byMeasure};
    if(ui.cid===cid&&ui.clientOpen&&ui.clientSub==='evaluaciones')render();
  });
}
function photosFor(cid,measureId){
  const c=photoCache[cid];
  return (c&&c.byMeasure[measureId])||[];
}
let pendingEvalPhotos={front:null,profile:null,back:null};
let pendingPhotoAngle=null;
function resetPendingEvalPhotos(){pendingEvalPhotos={front:null,profile:null,back:null};pendingPhotoAngle=null}

/* ---------- almacenamiento local ---------- */
let storageOK=true;
const SEX_OPT=['','Femenino','Masculino','Otro'];
const LEVEL_OPT=['','Principiante','Intermedio','Avanzado'];
function normalizeClient(c){
  return Object.assign({
    phone:'',birthdate:'',sex:'',height:null,weightInitial:null,goal:'',startDate:isoOf(new Date(c.created||Date.now())),
    level:'',frequency:'',notes:'',active:true,photo:null
  },c);
}
function normalizeCycle(c){
  return Object.assign({status:'g',notes:'',alertDismissWeek:null,active:true,currentWeek:1,weeks:4,startDate:today()},c);
}
function normalize(d){
  const b={v:2,clients:[],sessions:[],measures:[],exercises:[...DEFAULT_EX],cycles:[],wellness:[],draft:null,lastBackup:0,settings:{}};
  const o=Object.assign(b,d||{});
  ['clients','sessions','measures','exercises','cycles','wellness'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=b[k]});
  o.clients=o.clients.map(normalizeClient);
  o.cycles=o.cycles.map(normalizeCycle);
  if(!o.settings||typeof o.settings!=='object')o.settings={};
  if(o.settings.rirMode!=='RIR'&&o.settings.rirMode!=='RPE')o.settings.rirMode='RIR';
  o.settings.trainer=Object.assign({name:'',photo:null,whatsapp:'',email:'',bio:'',signature:''},o.settings.trainer||{});
  o.v=2;
  return o;
}
function load(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw)return normalize(JSON.parse(raw))}catch(e){storageOK=false}
  return normalize(null);
}
function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(db))}catch(e){storageOK=false}
}
let saveT;const saveSoon=()=>{clearTimeout(saveT);saveT=setTimeout(save,300)};
let db=load();
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

/* ---------- estado de interfaz ---------- */
const ui={tab:'inicio',cid:null,clientOpen:false,clientSub:'resumen',q:'',exSel:null,metric:'e1rm',mSel:'weight',exRange:'all',measRange:'all'};
let restAt=null,tInt=null,confirmCb=null;

const getClient=id=>db.clients.find(c=>c.id===id);
const activeClients=()=>db.clients.filter(c=>c.active);
const clientSessions=cid=>db.sessions.filter(s=>s.clientId===cid).sort((a,b)=>b.date.localeCompare(a.date)||(b.t-a.t));
const clientMeasures=cid=>db.measures.filter(m=>m.clientId===cid).sort((a,b)=>a.date.localeCompare(b.date)||(a.t-b.t));
const clientCycles=cid=>db.cycles.filter(cy=>cy.clientId===cid).sort((a,b)=>b.startDate.localeCompare(a.startDate));
const activeCycle=cid=>db.cycles.find(cy=>cy.clientId===cid&&cy.active);
const clientWellness=cid=>db.wellness.filter(x=>x.clientId===cid).sort((a,b)=>b.date.localeCompare(a.date)||(b.t-a.t));
const SEM_INFO={g:['🟢','Normal'],r:['🔴','Pesada'],b:['🔵','Descarga'],y:['🟡','Adaptación']};
function semBadge(cid){
  const cy=activeCycle(cid);
  if(!cy)return `<span class="sem n">Sin ciclo</span>`;
  const info=SEM_INFO[cy.status];
  return `<span class="sem ${cy.status}">${info[0]} ${info[1]}</span>`;
}
function lastFor(cid,name){
  const n=name.toLowerCase();
  for(const s of clientSessions(cid)){
    const e=s.exercises.find(x=>x.name.toLowerCase()===n);
    if(e)return {date:s.date,sets:e.sets,rirMode:s.rirMode||'RIR',note:(e.note||'').trim()};
  }
  return null;
}
const fmtSet=(s,mode)=>(s.w>0?fmtNum(s.w)+'×'+s.r:s.r+' reps')+((s.rir!=null&&s.rir!=='')?' · '+(mode||'RIR')+' '+s.rir:'');
function computeRecords(cid,name){
  const n=name.toLowerCase();
  let bestWeight=null,bestReps=null,bestVolume=null,last=null;
  clientSessions(cid).forEach(s=>{
    const e=s.exercises.find(x=>x.name.toLowerCase()===n);
    if(!e||!e.sets.length)return;
    if(!last)last={w:e.sets[0].w,r:e.sets[0].r,date:s.date};
    const vol=e.sets.reduce((a,x)=>a+x.w*x.r,0);
    if(!bestVolume||vol>bestVolume.vol)bestVolume={vol,date:s.date};
    e.sets.forEach(st=>{
      if(!bestWeight||st.w>bestWeight.w)bestWeight={w:st.w,r:st.r,date:s.date};
      if(!bestReps||st.r>bestReps.r)bestReps={w:st.w,r:st.r,date:s.date};
    });
  });
  if(!bestWeight)return null;
  return {bestWeight,bestReps,bestVolume,last};
}

/* ---------- render ---------- */
function render(top){
  const y=window.scrollY;
  // Si hay un campo enfocado dentro de #app, ciérralo a propósito ANTES de
  // reemplazar el HTML (en vez de dejar que el teclado se cierre como efecto
  // secundario de borrar el nodo). Un blur explícito deja al navegador
  // terminar la animación/el reacomodo del teclado de forma más confiable,
  // lo que evita que el "viewport visual" quede desincronizado del real
  // (causa típica de que los toques se registren desplazados tras usar la
  // app un rato).
  const focused=document.activeElement;
  if(focused&&focused!==document.body&&$('#app').contains(focused))focused.blur();
  stopTimer();
  const fullSession=ui.tab==='entrenamiento'&&db.draft;
  if(ui.clientOpen&&!getClient(ui.cid)){ui.clientOpen=false}
  const app=$('#app');
  app.className='wrap'+(fullSession?' full':'');
  let body;
  if(fullSession)body=sessionHTML();
  else if(ui.tab==='inicio')body=dashboardHTML();
  else if(ui.tab==='clientes')body=ui.clientOpen?fichaHTML():clientsTabHTML();
  else if(ui.tab==='entrenamiento')body=entrenamientoTabHTML();
  else if(ui.tab==='progreso')body=progresoTabHTML();
  else body=masHTML();
  app.innerHTML=body+(fullSession?'':navHTML());
  if(fullSession){tick();tInt=setInterval(tick,1000)}
  // Espera a que el navegador termine de acomodar el layout (incluido el
  // cierre del teclado) antes de restaurar el scroll, en vez de hacerlo de
  // inmediato contra medidas que todavía pueden estar cambiando.
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      const maxY=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);
      window.scrollTo(0,top?0:Math.min(y,maxY));
    });
  });
}
function stopTimer(){if(tInt){clearInterval(tInt);tInt=null}}
function tick(){
  const a=$('#tm'),r=$('#rest');
  if(a&&db.draft)a.textContent=mmss(Date.now()-db.draft.start);
  if(r)r.textContent=restAt?mmss(Date.now()-restAt):'0:00';
}
function navHTML(){
  const items=[['inicio','🏠','Inicio'],['clientes','👥','Clientes'],['entrenamiento','🏋️','Entrenar'],['progreso','📈','Progreso'],['mas','⋯','Más']];
  return `<div class="navbar">${items.map(([k,ic,l])=>`<button class="${ui.tab===k?'on':''}" data-act="navto" data-k="${k}"><span class="ic">${ic}</span>${l}${k==='entrenamiento'&&db.draft?' •':''}</button>`).join('')}</div>`;
}

/* ---------- dashboard (Inicio) ---------- */
function backupDays(){const d=db.settings.backupDays;return d===0?0:(d||7)}
function backupAgo(){return db.lastBackup?Math.floor((Date.now()-db.lastBackup)/864e5):null}
function backupDue(){
  const n=backupDays();
  if(!n||!db.clients.length)return false;
  if(db.settings.backupSnooze&&Date.now()<db.settings.backupSnooze)return false;
  const a=backupAgo();
  return a===null||a>=n;
}
function backupBanner(){
  if(!backupDue())return '';
  const a=backupAgo();
  const msg=a===null?'Aún no has hecho ningún respaldo.':'Tu último respaldo fue hace '+a+(a===1?' día.':' días.');
  return `<div class="banner warn" style="flex-direction:column;align-items:stretch;gap:10px"><div><b>Hora de respaldar tus datos</b><div class="m" style="color:inherit;margin-top:2px">${msg} Guárdalo en tu Google Drive para no perder clientes ni fotos.</div></div><div class="btns"><button class="btn sm" data-act="fullBackupShare">Respaldar ahora</button><button class="btn ghost sm" data-act="snoozeBackup">Más tarde</button></div></div>`;
}
function dashboardHTML(){
  const act=activeClients();
  const mon=mondayOf(new Date());
  const wk=db.sessions.filter(s=>parseIso(s.date)>=mon).length;
  const now=new Date();
  const mo=db.sessions.filter(s=>{const d=parseIso(s.date);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()}).length;
  const evalPend=act.filter(c=>{const ms=clientMeasures(c.id);return !ms.length||daysSince(ms[ms.length-1].date)>=30}).length;
  const attention=act.filter(c=>{const ss=clientSessions(c.id);return !ss.length||daysSince(ss[0].date)>=14});

  let h=`<div class="top"><h1>Inicio</h1><img class="toplogo" src="brand/logo-mark.png" alt="Ricardo Aguilar"></div>`;
  if(!storageOK)h+=`<div class="banner warn">Este navegador no permite guardar datos. Usa «Más → Respaldo» para no perder nada.</div>`;
  h+=backupBanner();
  if(db.draft){
    const c=getClient(db.draft.clientId);
    h+=`<button class="banner" data-act="goSession"><div><b>Sesión en curso</b> con ${esc(c?c.name:'cliente')}</div><span>Continuar</span></button>`;
  }
  h+=`<div class="dash">
    <div class="card"><span class="num">${act.length}</span><span class="m">Clientes activos</span></div>
    <div class="card"><span class="num">${wk}</span><span class="m">Entrenos esta semana</span></div>
    <div class="card"><span class="num">${mo}</span><span class="m">Entrenos este mes</span></div>
    <div class="card"><span class="num">${evalPend}</span><span class="m">Evaluaciones pendientes</span></div>
  </div>`;

  h+=`<h2 style="font-size:17px;margin:4px 2px 8px">Estado de carga</h2>`;
  if(!act.length)h+=empty('Aún no tienes clientes activos');
  else h+=[...act].sort((a,b)=>a.name.localeCompare(b.name,'es')).map(c=>{
    const cy=activeCycle(c.id);
    const sub=cy?`Semana ${cy.currentWeek} de ${cy.weeks}`:'Sin ciclo configurado';
    return `<button class="card row" data-act="openClient" data-id="${c.id}">
      <div class="grow"><div class="t">${esc(c.name)}</div><div class="m">${sub}</div></div>
      ${semBadge(c.id)}
    </button>`;
  }).join('');

  if(attention.length){
    h+=`<h2 style="font-size:17px;margin:14px 2px 8px">Alertas</h2>`;
    h+=attention.slice(0,4).map(c=>{
      const ss=clientSessions(c.id);
      const msg=!ss.length?`${esc(c.name)} todavía no tiene entrenamientos registrados.`:`${esc(c.name)} lleva ${daysSince(ss[0].date)} días sin entrenar.`;
      return `<button class="card row" data-act="openClient" data-id="${c.id}"><div class="m" style="color:var(--text)">${msg}</div></button>`;
    }).join('');
  }
  return h;
}

/* ---------- pestaña Clientes (lista) ---------- */
function clientsTabHTML(){
  let h=`<div class="top"><h1>Clientes</h1></div>`;
  h+=`<input class="input" type="search" placeholder="Buscar cliente" value="${esc(ui.q)}" data-in="q" autocomplete="off" style="margin-bottom:12px">`;
  h+=`<div id="list">${clientsListHTML()}</div><button class="fab" data-act="newClient">+ Cliente</button>`;
  return h;
}
function clientsListHTML(){
  const q=ui.q.trim().toLowerCase();
  if(!db.clients.length)return empty('Aún no tienes clientes','Toca «+ Cliente» para agregar el primero.');
  const cs=db.clients.filter(c=>!q||c.name.toLowerCase().includes(q)).sort((a,b)=>(a.active!==b.active)?(a.active?-1:1):a.name.localeCompare(b.name,'es'));
  if(!cs.length)return empty('Sin resultados');
  return cs.map(c=>{
    const ss=clientSessions(c.id),last=ss[0];
    return `<button class="card row" data-act="openClient" data-id="${c.id}" style="${c.active?'':'opacity:.55'}">
      <div class="av">${c.photo?`<img src="${c.photo}" alt="">`:esc(initials(c.name))}</div>
      <div class="grow"><div class="t">${esc(c.name)}${c.active?'':' · inactivo'}</div><div class="m">${esc(c.goal||'Sin objetivo definido')}</div></div>
      <div class="r"><div class="m">${ss.length} ${ss.length===1?'sesión':'sesiones'}</div><div class="m">${last?'Última: '+fmtDate(last.date):'Sin sesiones'}</div></div>
    </button>`;
  }).join('');
}

/* ---------- ficha de cliente ---------- */
function fichaHTML(){
  const c=getClient(ui.cid),ss=clientSessions(c.id),ms=clientMeasures(c.id);
  const first=c.weightInitial,lastM=ms[ms.length-1];
  const cur=lastM&&lastM.weight!=null?lastM.weight:first;
  const diff=(first!=null&&cur!=null)?cur-first:null;
  const age=calcAge(c.birthdate);
  let h=`<div class="top"><button class="x" data-act="closeClient" aria-label="Volver">‹</button><h1>${esc(c.name)}</h1><button class="btn ghost sm" data-act="editClient">Editar</button></div>`;
  h+=`<div class="row" style="margin-bottom:10px">
    <div class="av lg">${c.photo?`<img src="${c.photo}" alt="">`:esc(initials(c.name))}</div>
    <div class="grow">
      <div class="t">${esc(c.goal||'Sin objetivo definido')}</div>
      <div class="m">${[age!=null?age+' años':null,c.sex||null,c.level||null].filter(Boolean).join(' · ')||'Sin datos básicos'}</div>
    </div>
    ${semBadge(c.id)}
  </div>`;
  h+=`<div class="tabs">${[['resumen','Resumen'],['entrenamientos','Entrenos'],['evaluaciones','Evaluaciones'],['progreso','Progreso'],['informes','Informes']].map(([k,l])=>`<button class="${ui.clientSub===k?'on':''}" data-act="clientSub" data-t="${k}">${l}</button>`).join('')}</div>`;
  if(ui.clientSub==='resumen'){

/* ---------- progreso (por ejercicio) ---------- */
const METRICS={e1rm:'1RM estimado',max:'Peso máximo',vol:'Volumen',reps:'Reps máximas'};
const RANGE_OPTS=[['7d','7 días',7],['30d','30 días',30],['3m','3 meses',91],['6m','6 meses',183],['all','Todo',null]];
function withinRange(iso,key){
  const opt=RANGE_OPTS.find(o=>o[0]===key)||RANGE_OPTS[RANGE_OPTS.length-1];
  if(opt[2]==null)return true;
  return daysSince(iso)<=opt[2];
}
function metricVal(sets,m){
  if(m==='vol')return sets.reduce((a,s)=>a+s.w*s.r,0);
  if(m==='max')return Math.max(...sets.map(s=>s.w));
  if(m==='reps')return Math.max(...sets.map(s=>s.r));
  return Math.max(...sets.map(s=>s.w*(1+s.r/30)));
}
function progHTML(c,ss){
  const names=[...new Set(ss.flatMap(s=>s.exercises.map(e=>e.name)))].sort((a,b)=>a.localeCompare(b,'es'));
  if(!names.length)return empty('Aún no hay datos','Registra sesiones para ver su progresión.');
  if(!ui.exSel||!names.includes(ui.exSel))ui.exSel=names[0];
  const filteredSs=ss.filter(s=>withinRange(s.date,ui.exRange));
  const asc=[...filteredSs].reverse(),raw=[];let bw=true;
  asc.forEach(s=>{const e=s.exercises.find(x=>x.name===ui.exSel);if(e){raw.push({d:s.date,sets:e.sets});if(e.sets.some(x=>x.w>0))bw=false}});
  const m=bw?'reps':(ui.metric==='reps'?'e1rm':ui.metric);
  const pts=raw.map(p=>({d:p.d,y:metricVal(p.sets,m)}));
  const base=raw.map(p=>metricVal(p.sets,bw?'reps':'e1rm'));
  const unit=m==='reps'?'reps':'kg';
  let h=`<div class="card"><label style="margin:0">Ejercicio<select class="input" data-in="exsel">${names.map(n=>`<option ${n===ui.exSel?'selected':''}>${esc(n)}</option>`).join('')}</select></label>
    <div class="seg">${RANGE_OPTS.map(([k,l])=>`<button class="${(ui.exRange||'all')===k?'on':''}" data-act="exRange" data-r="${k}">${l}</button>`).join('')}</div>`;
  if(!bw)h+=`<div class="seg">${['e1rm','max','vol'].map(k=>`<button class="${m===k?'on':''}" data-act="metric" data-m="${k}">${METRICS[k]}</button>`).join('')}</div>`;
  h+=chart(pts);
  if(pts.length){
    const first=pts[0].y,last=pts[pts.length-1].y,best=Math.max(...pts.map(p=>p.y));
    const dl=first>0?(last-first)/first*100:0;
    h+=`<div class="stats"><div><span class="num">${fmtNum(first)}</span><span class="m">Primero</span></div><div><span class="num">${fmtNum(last)}</span><span class="m">Último</span></div><div><span class="num">${fmtNum(best)}</span><span class="m">Mejor</span></div><div><span class="num ${dl>=0?'up':'down'}">${dl>=0?'+':''}${Math.round(dl)}%</span><span class="m">Cambio</span></div></div>
    <div class="m" style="margin-top:8px">${METRICS[m]} en ${unit}, mejor serie de cada sesión.${m==='e1rm'?' Fórmula de Epley.':''}</div>`;
  }
  const lastSet=lastFor(c.id,ui.exSel);
  if(lastSet)h+=`<div class="m" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)"><b style="color:var(--text)">Último registro</b> (${fmtDate(lastSet.date)}): ${lastSet.sets.map(s=>fmtSet(s,lastSet.rirMode)).join(' · ')}${lastSet.note?`<div style="margin-top:4px">Nota: ${esc(lastSet.note)}</div>`:''}</div>`;
  h+=`</div>`;
  if(base.length>=4&&Math.max(...base.slice(-3))<=Math.max(...base.slice(0,-3))){
    h+=`<div class="banner warn" style="display:block">Posible estancamiento: en las últimas 3 sesiones no superó su mejor marca anterior en este ejercicio.</div>`;
  }
  return h;
}
function chart(pts){
  if(pts.length<2)return `<div class="empty">Necesitas al menos 2 registros para ver la gráfica.</div>`;
  const W=320,H=170,pl=40,pr=16,pt=16,pb=26;
  let mn=Math.min(...pts.map(p=>p.y)),mx=Math.max(...pts.map(p=>p.y));
  if(mn===mx){mn-=1;mx+=1}
  const pad=(mx-mn)*.15;mn-=pad;mx+=pad;
  const X=i=>pl+(W-pl-pr)*(i/(pts.length-1));
  const Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let g='';
  for(let k=0;k<3;k++){const v=mn+(mx-mn)*k/2,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="gl"/><text x="${pl-6}" y="${(y+3).toFixed(1)}" text-anchor="end" class="ax">${fmtNum(v)}</text>`}
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
  const dots=pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5" class="dot"/>`).join('');
  const L=pts.length-1;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Gráfica de progreso">${g}<path d="${d}" class="ln"/>${dots}
  <text x="${pl}" y="${H-8}" class="ax">${fmtDate(pts[0].d)}</text><text x="${W-pr}" y="${H-8}" text-anchor="end" class="ax">${fmtDate(pts[L].d)}</text>
  <text x="${X(L).toFixed(1)}" y="${(Y(pts[L].y)-9).toFixed(1)}" text-anchor="end" class="val">${fmtNum(pts[L].y)}</text></svg>`;
}

function comparePhotosModal(cid,beforeId,afterId){

  if(!withPhotos.length){openModal(`<h2>Comparar fotos</h2><p class="m">Aún no hay evaluaciones con fotos para este cliente.</p><button class="btn ghost full" data-act="closeModal">Cerrar</button>`);return}
  const before=(beforeId&&withPhotos.find(m=>m.id===beforeId))||withPhotos[0];
  const after=(afterId&&withPhotos.find(m=>m.id===afterId))||withPhotos[withPhotos.length-1];
  let h=`<h2>Comparar fotos</h2>
    <div class="m" style="margin:0 0 4px">Antes</div><div class="seg" style="margin-top:0">${withPhotos.map(m=>`<button class="${m.id===before.id?'on':''}" data-act="cmpPick" data-which="before" data-cid="${cid}" data-before="${before.id}" data-after="${after.id}" data-id="${m.id}">${fmtDate(m.date)}</button>`).join('')}</div>
    <div class="m" style="margin:10px 0 4px">Después</div><div class="seg" style="margin-top:0">${withPhotos.map(m=>`<button class="${m.id===after.id?'on':''}" data-act="cmpPick" data-which="after" data-cid="${cid}" data-before="${before.id}" data-after="${after.id}" data-id="${m.id}">${fmtDate(m.date)}</button>`).join('')}</div>`;
  PHOTO_ANGLES.forEach(([angle,label])=>{
    const pb=photosFor(cid,before.id).find(p=>p.angle===angle);
    const pa=photosFor(cid,after.id).find(p=>p.angle===angle);
    if(!pb&&!pa)return;
    h+=`<div class="m" style="margin:10px 0 4px">${label}</div><div class="grid2">
      <div>${pb?`<img src="${pb.data}" alt="" style="width:100%;border-radius:10px">`:empty('Sin foto')}</div>
      <div>${pa?`<img src="${pa.data}" alt="" style="width:100%;border-radius:10px">`:empty('Sin foto')}</div>
    </div>`;
  });
  h+=`<button class="btn ghost full" data-act="closeModal" style="margin-top:14px">Cerrar</button>`;
  openModal(h);
}

/* datos comunes del informe (los usan la pantalla y el PDF) */
const REPORT_MEASURES=['waist','abdomen','hip','chest','arm','thigh','calf','neck'];
async function reportData(cid){
  const c=getClient(cid);if(!c)return null;
  const ss=clientSessions(cid);            // más reciente primero
  const ms=clientMeasures(cid);            // más antigua primero
  let photos=[];
  try{photos=await getPhotosByClient(cid)}catch(e){}
  const trainer=db.settings.trainer||{};
  const stat=k=>{
    const v=ms.filter(m=>m[k]!=null);
    if(!v.length)return null;
    let a=v[0][k];const b=v[v.length-1][k];
    if(k==='weight'&&v.length===1&&c.weightInitial!=null)a=c.weightInitial;
    const n=k==='weight'&&v.length===1&&c.weightInitial!=null?2:v.length;
    return {first:a,last:b,delta:n>1?Math.round((b-a)*100)/100:null};
  };
  const stats={weight:stat('weight'),fat:stat('fat'),muscleKg:stat('muscleKg'),muscle:stat('muscle'),imc:stat('imc')};
  const weightPts=ms.filter(m=>m.weight!=null).map(m=>({d:m.date,y:m.weight}));
  // medidas corporales
  const meas=[];
  REPORT_MEASURES.forEach(k=>{
    const s=stat(k);if(!s)return;
    meas.push({k,label:MFIELDS[k][0],unit:MFIELDS[k][1],first:s.first,last:s.last,delta:s.delta});
  });
  const maxAbs=Math.max(1,...meas.map(x=>Math.abs(x.delta||0)));
  meas.forEach(x=>{x.frac=x.delta==null?0:Math.max(.08,Math.abs(x.delta)/maxAbs)});
  // fuerza por ejercicio
  const asc=[...ss].reverse();
  const byEx={};
  asc.forEach(s=>s.exercises.forEach(e=>{
    const key=e.name.toLowerCase();
    const ws=e.sets.filter(x=>x.w>0&&x.r>0).map(x=>x.w);
    if(!ws.length)return;
    const o=byEx[key]=byEx[key]||{name:e.name,pts:[]};
    o.pts.push({d:s.date,y:Math.max(...ws)});
  }));
  const exList=Object.values(byEx).map(o=>{
    const f=o.pts[0].y,l=o.pts[o.pts.length-1].y;
    const rec=computeRecords(cid,o.name);
    return {name:o.name,pts:o.pts,first:f,last:l,pct:o.pts.length>1?(l-f)/f:null,rec};
  });
  const improved=exList.filter(x=>x.pct!=null&&x.pct>0).sort((a,b)=>b.pct-a.pct);
  let star=improved[0]||null;
  if(!star&&exList.length)star=[...exList].sort((a,b)=>b.pts.length-a.pts.length)[0];
  const records=exList.filter(x=>x.rec).map(x=>({name:x.name,w:x.rec.bestWeight.w,r:x.rec.bestWeight.r,date:x.rec.bestWeight.date}))
    .sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);
  // fotos
  const byM={};photos.forEach(p=>{(byM[p.measureId]=byM[p.measureId]||[]).push(p)});
  const withPh=ms.filter(m=>(byM[m.id]||[]).length);
  let photoPairs=[];
  if(withPh.length){
    const bm=withPh[0],am=withPh[withPh.length-1];
    PHOTO_ANGLES.forEach(([angle,label])=>{
      const pb=(byM[bm.id]||[]).find(p=>p.angle===angle);
      const pa=(byM[am.id]||[]).find(p=>p.angle===angle);
      if(!pb&&!pa)return;
      photoPairs.push({angle,label,before:withPh.length>1&&pb?{data:pb.data,date:bm.date}:null,after:pa?{data:pa.data,date:am.date}:(pb&&withPh.length===1?{data:pb.data,date:bm.date}:null)});
    });
  }
  // fechas y periodo
  const dates=[...ms.map(m=>m.date),...ss.map(s=>s.date)].sort();
  const startIso=(c.startDate&&dates.length&&c.startDate<dates[0])?c.startDate:(dates[0]||today());
  const endIso=dates.length?dates[dates.length-1]:today();
  const weeks=Math.max(1,Math.round((parseIso(endIso)-parseIso(startIso))/864e5/7));
  let note='';
  for(let i=ms.length-1;i>=0;i--){if(ms[i].note&&ms[i].note.trim()){note=ms[i].note.trim();break}}
  const cy=activeCycle(cid);
  return {c,trainer,ss,ms,stats,weightPts,meas,exList,improved,star,records,photoPairs,startIso,endIso,weeks,note,cy,
    trainerName:trainer.name||'Ricardo Aguilar',contact:[trainer.whatsapp,trainer.email].filter(Boolean).join('  ·  '),
    evalNo:ms.length,lastEval:ms.length?ms[ms.length-1].date:null};
}

/* --- pantalla --- */
const APP_VERSION='10';
let rpState=null;
const rpSigned=n=>(n<0?'−':n>0?'+':'')+fmtNum(Math.abs(n));
function rpLine(pts,label){
  if(!pts||!pts.length)return '';
  const W=320,H=130,px=18,top=24,bot=14;
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);
  if(mn===mx){mn-=1;mx+=1}
  const pad=(mx-mn)*.18;mn-=pad;mx+=pad;
  const ts=pts.map(p=>parseIso(p.d).getTime()),t0=ts[0],t1=ts[ts.length-1];
  const X=i=>pts.length===1?W/2:(t1===t0?px+(W-2*px)*i/(pts.length-1):px+(W-2*px)*(ts[i]-t0)/(t1-t0));
  const Y=v=>top+(H-top-bot)*(1-(v-mn)/(mx-mn));
  const xy=pts.map((p,i)=>[X(i),Y(p.y)]);
  const path=xy.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const L=xy.length-1;
  const area=xy.length>1?`<path d="${path} L${xy[L][0].toFixed(1)} ${H-bot} L${xy[0][0].toFixed(1)} ${H-bot}Z" fill="#F0010A" fill-opacity=".12"/>`:'';
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label)}" style="display:block">`;
  [top,(top+H-bot)/2,H-bot].forEach(y=>{s+=`<line x1="8" y1="${y}" x2="${W-8}" y2="${y}" stroke="#232327"/>`});
  s+=area;
  if(xy.length>1)s+=`<path d="${path}" fill="none" stroke="#F0010A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  xy.forEach((q,i)=>{s+=i===L?`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="6.5" fill="#F0010A"/>`:`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4.5" fill="#000" stroke="#F0010A" stroke-width="2.5"/>`});
  s+=`<text x="${Math.min(Math.max(xy[0][0],16),W-16).toFixed(1)}" y="${(xy[0][1]-10).toFixed(1)}" fill="#A1A1AA" font-size="11" text-anchor="middle" font-family="Montserrat,sans-serif">${fmtNum(pts[0].y)}</text>`;
  if(L>0)s+=`<text x="${Math.min(xy[L][0],W-16).toFixed(1)}" y="${(xy[L][1]-12).toFixed(1)}" fill="#fff" font-size="13" font-weight="700" text-anchor="middle" font-family="Montserrat,sans-serif">${fmtNum(pts[L].y)}</text>`;
  return s+'</svg>';
}
function rpSec(t){return `<div class="rp-sec"><span></span>${esc(t)}</div>`}
function rpHead(d,eyebrow,sub){
  const parts=d.c.name.trim().split(/\s+/);
  const first=parts.shift(),rest=parts.join(' ');
  return `<div class="rp-head"><div class="rp-eyebrow">${esc(eyebrow)}</div><h1 class="rp-h1">${esc(first)}${rest?'<br>'+esc(rest):''}</h1><div class="rp-sub">${sub}</div><div class="rp-rule"></div></div>`;
}
function rpTile(lbl,val,unit,delta,sub){
  let dl='';
  if(sub)dl=`<span class="d n">${sub}</span>`;
  else if(delta==null)dl='<span class="d n">—</span>';
  else if(delta===0)dl='<span class="d n">sin cambio</span>';
  else dl=`<span class="d ${delta<0?'r':'w'}">${delta<0?'▼':'▲'} ${fmtNum(Math.abs(delta))}${unit&&unit!=='%'?' '+unit:unit==='%'?' pts':''}</span>`;
  return `<div class="rp-tile"><span class="l">${lbl}</span><span class="v">${val}<small>${unit?' '+unit:''}</small></span>${dl}</div>`;
}
function rpFoot(d){
  return `<div class="rp-foot"><img src="brand/logo-full.png" alt="${esc(d.trainerName)}, entrenador personal">${d.contact?`<div>${esc(d.contact)}</div>`:''}</div>`;
}
function rpCompareHTML(d){
  if(!d.photoPairs.length)return '';
  const pairs=d.photoPairs;
  const p0=pairs.find(p=>p.angle==='front')||pairs[0];
  let h=rpSec('Antes y después');
  if(p0.before&&p0.after){
    h+=`<div class="rp-cmp" id="rpCmp"><img class="a" src="${p0.after.data}" alt="Ahora"><div class="bf" id="rpBf" style="clip-path:inset(0 50% 0 0)"><img src="${p0.before.data}" alt="Antes"></div><div class="ln" id="rpLn" style="left:50%"></div><div class="kn" id="rpKn" style="left:50%"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l-6 6 6 6"/><path d="M15 6l6 6-6 6"/></svg></div><input type="range" min="0" max="100" value="50" class="rg" data-rprange aria-label="Deslizar para comparar antes y después"><span class="tg l">ANTES · ${esc(fmtDate(p0.before.date))}</span><span class="tg r">AHORA · ${esc(fmtDate(p0.after.date))}</span></div>`;
    const others=pairs.filter(p=>p!==p0&&p.before&&p.after);
    if(others.length)h+=`<div class="rp-note" style="margin-top:2px">También hay fotos de ${others.map(o=>esc(o.label.toLowerCase())).join(' y ')} en el PDF.</div>`;
  } else {
    const one=p0.after||p0.before;
    h+=`<div class="rp-cmp one"><img class="a" src="${one.data}" alt="Foto de progreso"><span class="tg r">AHORA · ${esc(fmtDate(one.date))}</span></div><div class="rp-note">Con una segunda evaluación con fotos verás aquí el antes y después.</div>`;
  }
  return h;
}
function rpEvalHTML(d){
  const name=d.c.name;
  if(!d.ms.length){
    return rpHead(d,'INFORME DE EVALUACIÓN','Sin evaluaciones todavía')+`<div class="rp-card"><p class="rp-p">Registra la primera evaluación en la pestaña Evaluaciones y aquí aparecerá el informe completo.</p></div>`+rpFoot(d);
  }
  const sub=`Evaluación ${d.evalNo}<i></i>${esc(fmtDateNice(d.lastEval))}`+(d.c.goal?`<br><span class="g">Objetivo: ${esc(d.c.goal)}</span>`:'');
  let h=rpHead(d,'INFORME DE EVALUACIÓN',sub);
  const t=[];
  if(d.stats.weight)t.push(rpTile('PESO',fmtNum(d.stats.weight.last),'kg',d.stats.weight.delta));
  if(d.stats.fat)t.push(rpTile('GRASA',fmtNum(d.stats.fat.last),'%',d.stats.fat.delta));
  if(d.stats.muscleKg)t.push(rpTile('MÚSCULO',fmtNum(d.stats.muscleKg.last),'kg',d.stats.muscleKg.delta));
  else if(d.stats.muscle)t.push(rpTile('MÚSCULO',fmtNum(d.stats.muscle.last),'%',d.stats.muscle.delta));
  if(t.length<3&&d.stats.imc)t.push(rpTile('IMC',fmtNum(d.stats.imc.last),'',d.stats.imc.delta));
  if(t.length){h+=rpSec('Tu progreso en números')+`<div class="rp-tiles n${t.length}">${t.join('')}</div>`}
  if(d.weightPts.length>1){
    h+=`<div class="rp-card"><div class="rp-cardh"><b>PESO CORPORAL</b><span>${d.weightPts.length} evaluaciones</span></div>${rpLine(d.weightPts,'Evolución del peso corporal')}<div class="rp-xl"><span>${esc(fmtDate(d.weightPts[0].d))}</span><span>${esc(fmtDate(d.weightPts[d.weightPts.length-1].d))}</span></div></div>`;
  }
  h+=rpCompareHTML(d);
  if(d.meas.length){
    h+=rpSec('Medidas corporales')+`<div class="rp-list">`+d.meas.map(m=>{
      const dl=m.delta==null?'':`<b class="${m.delta<0?'r':'w'}">${rpSigned(m.delta)}</b>`;
      const fill=m.delta==null?0:Math.round(m.frac*100);
      return `<div class="rp-li"><div class="rp-lr"><span class="n">${esc(m.label)}</span><span class="v">${m.delta==null?'<b>'+fmtNum(m.last)+' '+m.unit+'</b>':fmtNum(m.first)+' <i>→</i> <b>'+fmtNum(m.last)+' '+m.unit+'</b>'}${dl}</span></div>${m.delta==null?'':`<div class="rp-pb"><div class="${m.delta<0?'r':'w'}" style="width:${fill}%"></div></div>`}</div>`;
    }).join('')+`</div>`;
  }
  if(d.note)h+=`<div class="rp-card"><div class="rp-eyebrow" style="margin-bottom:8px">NOTA DE TU ENTRENADOR</div><p class="rp-p">${esc(d.note)}</p></div>`;
  return h+rpFoot(d);
}
function rpProgHTML(d){

  let h=rpHead(d,'INFORME DE PROGRESIÓN',sub);

  }
  if(d.records.length){
    h+=rpSec('Récords recientes')+`<div class="rp-recs">`+d.records.map(r=>`<div class="rp-rec"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M12 14v4"/><path d="M8 20h8"/></svg></span><div><b>${esc(r.name)} · ${fmtNum(r.w)} kg × ${r.r}</b><span>${esc(fmtDateNice(r.date))}</span></div></div>`).join('')+`</div>`;
  }
  return h+rpFoot(d);

/* --- PDF --- */
const PDF_FONTS=[['Montserrat-Regular.ttf','Montserrat','normal'],['Montserrat-Bold.ttf','Montserrat','bold'],['Montserrat-ExtraBold.ttf','MontserratXB','normal']];
let _pdfFontB64=null;
async function pdfFontData(){
  if(_pdfFontB64)return _pdfFontB64;
  const out=[];
  for(const [file] of PDF_FONTS){
    const r=await fetch('brand/'+file);if(!r.ok)throw new Error('font');
    const u8=new Uint8Array(await r.arrayBuffer());
    let bin='';for(let i=0;i<u8.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
    out.push(btoa(bin));
  }
  return (_pdfFontB64=out);
}
const _imgCache={};
async function brandDataUrl(file){
  if(_imgCache[file]!==undefined)return _imgCache[file];
  try{
    const r=await fetch('brand/'+file);if(!r.ok)throw new Error('img');
    const b=await r.blob();
    _imgCache[file]=await new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(b)});
  }catch(e){_imgCache[file]=null}
  return _imgCache[file];
}
function imgNatural(src){
  return new Promise(res=>{
    try{
      const im=new Image();
      const t=setTimeout(()=>res(null),2500);
      im.onload=()=>{clearTimeout(t);res({w:im.naturalWidth||3,h:im.naturalHeight||4})};
      im.onerror=()=>{clearTimeout(t);res(null)};
      im.src=src;
    }catch(e){res(null)}
  });
}

      });

  }
  /* plan actual */
  if(d.cy){
    section('Plan actual');

    font('n');doc.setFontSize(10);txt(INK);
    T('Semana '+d.cy.currentWeek+' de '+d.cy.weeks+' · carga '+info[1].toLowerCase(),M,y);y+=6;
    if(d.cy.notes){doc.splitTextToSize(d.cy.notes,CW).forEach(l=>{space(6);txt(GRY);T(l,M,y);y+=5.3})}
    y+=6;
  }
  /* cierre con marca */
  space(40);
  const ch=32;
  fill([0,0,0]);doc.roundedRect(M,y,CW,ch,3,3,'F');
  fill(RED);doc.rect(M,y+ch-1.4,CW,1.4,'F');
  if(logoFull){try{doc.addImage(logoFull,'PNG',M+6,y+4,46,46*444/1000)}catch(e){}}
  font('b');doc.setFontSize(9);txt([255,255,255]);
  T(d.trainerName,M+CW-6,y+12,{align:'right'});
  font('n');doc.setFontSize(8);txt([161,161,170]);
  if(trainer.whatsapp)T(trainer.whatsapp,M+CW-6,y+18,{align:'right'});
  if(trainer.email)T(trainer.email,M+CW-6,y+23,{align:'right'});
  if(!trainer.whatsapp&&!trainer.email)T('Entrenador personal',M+CW-6,y+18,{align:'right'});
  y+=ch+4;
  if(trainer.signature){font('n');doc.setFontSize(9);txt(GRY);doc.splitTextToSize(trainer.signature,CW).forEach(l=>{space(6);T(l,M,y+4);y+=5})}

  /* pie y numeración */
  const total=doc.getNumberOfPages();
  for(let i=2;i<=total;i++){
    doc.setPage(i);
    stroke(LGR);doc.setLineWidth(.2);doc.line(M,PH-14,PW-M,PH-14);
    font('b');doc.setFontSize(7.5);txt(INK);T(d.trainerName,M,PH-9);
    font('n');txt(GRY);T(' · Entrenador personal',M+doc.getTextWidth(d.trainerName)+(fontsOK?0.5:0.5),PH-9);
    font('b');txt(INK);T((i)+' / '+total,PW-M,PH-9,{align:'right'});
  }
  return doc;
}
/* ---------- entrega de archivos (compartir / descargar) ----------
   Tres caminos, probados en este orden:
   1. Web Share API — la mejor experiencia en un celular real (abre el
      selector de WhatsApp/correo/etc. directamente) y es lo que se usa
      cuando esta app vive en su propio dominio, instalada en la pantalla
      de inicio.
   2. La capacidad "downloads" de Claude — solo existe mientras se prueba
      la app dentro de claude.ai/artifact/…, donde las descargas comunes
      (<a download>) están bloqueadas por el visor. No está disponible
      (window.claude) en una instalación real fuera de Claude.
   3. Un enlace <a download> normal — funciona en cualquier navegador
      real una vez que la app esté alojada en su propio dominio.
*/
async function offerFile(filename,blob){
  try{
    const file=new File([blob],filename,{type:blob.type||'application/octet-stream'});
    if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:filename});return 'shared'}
      catch(shareErr){if(shareErr&&shareErr.name==='AbortError')return 'cancelled'}
    }
  }catch(e){}
  if(window.claude&&typeof window.claude.use==='function'){
    try{
      const downloads=await window.claude.use('downloads');
      if(downloads){
        try{await downloads.save({filename,data:blob});return 'saved'}
        catch(err){if(err&&err.code==='declined')return 'cancelled';return 'error'}
      }
    }catch(e){}
  }
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    return 'saved';
  }catch(e){return 'error'}
}
async function sharePDF(cid){
  if(!(window.jspdf&&window.jspdf.jsPDF)){toast('No se pudo cargar el generador de PDF. Revisa tu conexión e inténtalo de nuevo.');return}
  toast('Generando PDF…');
  let doc;
  try{doc=await generateReportPDF(cid)}catch(e){toast('No se pudo generar el PDF');return}
  if(!doc){toast('No se pudo generar el PDF');return}
  const c=getClient(cid);
  const fname=`Informe-${(c?c.name:'cliente').replace(/[^\w]+/g,'_')}-${today()}.pdf`;
  const blob=doc.output('blob');
  const result=await offerFile(fname,blob);
  if(result==='saved')toast('PDF descargado');
  else if(result==='shared')toast('PDF compartido');
  else if(result==='error')toast('No se pudo guardar el PDF. Inténtalo de nuevo.');
}

    return;
  }
  if(!db.draft)db.draft={id:uid(),clientId:cid,date:today(),start:Date.now(),exercises:[],note:''};
  ui.cid=cid;ui.tab='entrenamiento';restAt=Date.now();save();render(true);
}
function addExercise(name){
  name=String(name||'').trim();
  if(!name)return;
  const hit=db.exercises.find(n=>n.toLowerCase()===name.toLowerCase());
  const canon=hit||name;
  const d=db.draft;
  if(d.exercises.some(e=>e.name.toLowerCase()===canon.toLowerCase())){toast('Ese ejercicio ya está en la sesión');return}
  const prev=lastFor(d.clientId,canon);
  const n=Math.min(8,Math.max(1,prev?prev.sets.length:3));
  d.exercises.push({name:canon,sets:Array.from({length:n},()=>({w:'',r:'',rir:''})),note:''});
  saveSoon();render();
}
function copyPrevSession(){
  const d=db.draft,last=clientSessions(d.clientId)[0];
  if(!last){toast('No hay una sesión anterior');return}
  let added=0;
  last.exercises.forEach(e=>{
    if(d.exercises.some(x=>x.name.toLowerCase()===e.name.toLowerCase()))return;
    const n=Math.min(8,Math.max(1,e.sets.length));
    d.exercises.push({name:e.name,note:'',sets:Array.from({length:n},()=>({w:'',r:'',rir:''}))});
    added++;
  });
  saveSoon();render();
  toast(added?`${added} ejercicio${added===1?'':'s'} añadido${added===1?'':'s'} de la última sesión`:'Ya tienes todos los ejercicios de la última sesión');
}

function draftExercises(){
  const s=db.draft,exs=[];
  s.exercises.forEach(ex=>{
    const sets=ex.sets.map(x=>({w:num(x.w)||0,r:parseInt(x.r,10),rir:(x.rir==null||x.rir==='')?null:x.rir})).filter(x=>x.r>0);
    if(sets.length)exs.push({name:ex.name,sets,note:(ex.note||'').trim()});
  });
  return exs;
}
function detectRecords(cid,exs){
  const msgs=[];
  exs.forEach(e=>{
    const pr=computeRecords(cid,e.name);
    e.sets.forEach(st=>{
      if(!pr||st.w>pr.bestWeight.w)msgs.push(`${e.name}: nuevo mejor peso (${fmtNum(st.w)} kg)`);
      else if(st.w===pr.bestWeight.w&&st.r>pr.bestWeight.r)msgs.push(`${e.name}: más reps con ${fmtNum(st.w)} kg`);
    });
  });
  return [...new Set(msgs)];
}

function finishSession(){

  if(!exs.length){toast('Agrega al menos una serie con repeticiones');return}
  const prs=detectRecords(s.clientId,exs);
  db.sessions.push({id:s.id,clientId:s.clientId,date:s.date,t:s.start,dur:Math.round((Date.now()-s.start)/60000),exercises:exs,note:(s.note||'').trim(),rirMode:db.settings.rirMode});
  exs.forEach(e=>{if(!db.exercises.some(n=>n.toLowerCase()===e.name.toLowerCase()))db.exercises.push(e.name)});
  db.draft=null;closeModal();save();
  ui.clientOpen=true;ui.tab='clientes';ui.clientSub='entrenamientos';ui.exSel=null;
  render(true);
  toast(prs.length?'🏆 '+prs[0]+(prs.length>1?` y ${prs.length-1} más`:''):'Sesión guardada');
}

/* ---------- entrada por voz ---------- */
const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
const micSupported=()=>!!SpeechRec;
let activeRecog=null;
function voiceErrorMsg(err){
  if(err==='not-allowed'||err==='service-not-allowed')return 'Permiso de micrófono denegado. Actívalo en Chrome.';
  if(err==='no-speech')return 'No se detectó voz, intenta de nuevo';
  if(err==='network')return 'Sin conexión: el micrófono necesita internet';
  return 'No se pudo usar el micrófono';
}
function stopVoice(){if(activeRecog){try{activeRecog.abort()}catch(e){}activeRecog=null}}
function startRecognition(btn,onText){
  if(!micSupported()){toast('Este navegador no soporta entrada por voz');return}
  if(activeRecog){stopVoice();return}
  const rec=new SpeechRec();
  rec.lang='es-PE';rec.interimResults=false;rec.maxAlternatives=1;rec.continuous=false;
  activeRecog=rec;
  btn.classList.add('on');
  rec.onresult=ev=>{try{onText(ev.results[0][0].transcript)}catch(err){}};
  rec.onerror=ev=>{if(ev.error!=='aborted')toast(voiceErrorMsg(ev.error))};
  rec.onend=()=>{btn.classList.remove('on');if(activeRecog===rec)activeRecog=null};
  try{rec.start()}catch(e){btn.classList.remove('on');activeRecog=null;toast('No se pudo iniciar el micrófono')}
}
function voiceCaptureSet(i,btn){
  startRecognition(btn,text=>{
    const nums=(text.match(/\d+(?:[.,]\d+)?/g)||[]).map(n=>parseFloat(n.replace(',','.')));
    if(!nums.length){toast('No entendí números. Di, por ejemplo: «60, 8, 2»');return}
    const ex=db.draft.exercises[i];if(!ex)return;
    let j=ex.sets.findIndex(x=>!String(x.r).trim());
    if(j===-1){ex.sets.push({w:'',r:'',rir:''});j=ex.sets.length-1}
    const st=ex.sets[j];
    if(nums.length>=3){st.w=String(nums[0]);st.r=String(Math.round(nums[1]));st.rir=String(nums[2])}
    else if(nums.length===2){st.w=String(nums[0]);st.r=String(Math.round(nums[1]))}
    else{st.r=String(Math.round(nums[0]))}
    saveSoon();render();toast(`Serie ${j+1}: ${fmtSet(st,db.settings.rirMode)}`);
  });
}
function voiceCaptureExercise(btn){
  startRecognition(btn,text=>{
    const name=text.trim().replace(/^\p{L}/u,c=>c.toUpperCase());
    if(!name)return;
    addExercise(name);toast('Ejercicio añadido: '+name);
  });
}

    case 'resetRest':restAt=Date.now();tick();break;

    case 'stepR':{const st=db.draft.exercises[+ds.i].sets[+ds.j];const cur=parseInt(st.r,10)||0;const nv=Math.max(0,cur+(+ds.d));st.r=String(nv);saveSoon();render();break}

function onInput(k,ds,v){
  if(k==='q'){ui.q=v;if(ui.tab==='clientes'&&!ui.clientOpen)$('#list').innerHTML=clientsListHTML();else render();return}
  if(k==='exsel'){ui.exSel=v;render();return}
  if(k==='note'){if(db.draft){db.draft.note=v;saveSoon()}return}
  if(k==='exnote'){if(db.draft){db.draft.exercises[+ds.i].note=v;saveSoon()}return}
  if(k==='w'||k==='r'||k==='rir'){if(db.draft){db.draft.exercises[+ds.i].sets[+ds.j][k]=v;saveSoon()}return}
}

document.addEventListener('input',e=>{const t=e.target.closest('[data-in]');if(t)onInput(t.dataset.in,t.dataset,t.value)});

  if(e.target.id==='cf_photo_input'){

  }
  if(e.target.id==='evalPhotoInput'){
    const f=e.target.files&&e.target.files[0];if(!f||!pendingPhotoAngle)return;
    const angle=pendingPhotoAngle;
    compressImage(f,480,url=>{pendingEvalPhotos[angle]=url;refreshEvalPhotoSlot(angle)});

    compressImage(f,480,url=>{$('#tf_photo').value=url;$('#tf_photo_prev').innerHTML=`<img src="${url}" style="width:64px;height:64px;border-radius:50%;object-fit:cover">`});
  }

    const f=e.target.files&&e.target.files[0];if(!f)return;

  }
});

    note:$('#mN').value.trim(),
    imc:(weight!=null&&c&&c.height)?Math.round((weight/((c.height/100)*(c.height/100)))*10)/10:null
  };
  const hasVal=['weight','fat','muscle','muscleKg','neck','chest','waist','abdomen','hip','arm','thigh','calf'].some(k=>m[k]!=null);

  }catch(e){}

}

  let ok=false;
  try{await navigator.clipboard.writeText(ta.value);ok=true}catch(e){}
  if(!ok){try{ta.focus();ta.select();ok=document.execCommand('copy')}catch(e){}}
  if(ok){db.lastBackup=Date.now();save();toast('Respaldo copiado');render()}
  else{ta.focus();ta.select();toast('Mantén presionado el texto y elige Copiar')}
}
function restoreBackup(){
  let data;
  try{data=JSON.parse($('#bk').value)}catch(e){toast('El texto no es un respaldo válido');return}
  if(!data||!Array.isArray(data.clients)||!Array.isArray(data.sessions)){toast('El texto no es un respaldo válido');return}
  confirmDlg('Esto reemplaza todos los datos actuales por los del respaldo.','Restaurar',()=>{
    db=normalize({clients:data.clients,sessions:data.sessions,measures:data.measures,exercises:data.exercises,cycles:data.cycles,wellness:data.wellness,settings:data.settings,draft:null,lastBackup:Date.now()});
    save();ui.tab='inicio';ui.clientOpen=false;render(true);toast('Datos restaurados');
  });
}

/* ---------- respaldo completo (incluye fotos) ---------- */
function fullBackupModal(){
  openModal(`<h2>Respaldo completo</h2>
    <p class="m">Genera un archivo .json con todos tus datos, incluidas las fotos de progreso. Pesa más que el respaldo de texto, así que se descarga o se comparte como archivo (por ejemplo a tu correo o a WhatsApp, enviándotelo a ti mismo).</p>
    <div class="btns" style="margin-top:12px"><button class="btn full" data-act="fullBackupShare">Generar y compartir archivo</button></div>
    <p class="m" style="margin-top:16px">Para restaurar desde un archivo de este tipo:</p>
    <div class="btns"><button class="btn ghost full" data-act="pickRestoreFile">Elegir archivo y restaurar</button></div>
    <input type="file" id="restoreFileInput" accept="application/json,.json" style="display:none">
    <button class="btn ghost full" data-act="closeModal" style="margin-top:6px">Cerrar</button>`);
}
async function fullBackupExport(){
  let photos=[];
  try{photos=await getAllPhotos()}catch(e){}
  return JSON.stringify({app:'registro-clientes',v:2,full:true,exportedAt:new Date().toISOString(),clients:db.clients,sessions:db.sessions,measures:db.measures,exercises:db.exercises,cycles:db.cycles,wellness:db.wellness,settings:db.settings,photos});
}
async function shareFullBackup(){
  toast('Preparando respaldo completo…');
  let json;
  try{json=await fullBackupExport()}catch(e){toast('No se pudo preparar el respaldo');return}
  const filename='respaldo-registro-clientes-'+today()+'.json';
  const blob=new Blob([json],{type:'application/json'});
  const result=await offerFile(filename,blob);
  if(result==='saved'){db.lastBackup=Date.now();save();toast('Respaldo descargado');render()}
  else if(result==='shared'){db.lastBackup=Date.now();save();toast('Respaldo compartido');render()}
  else if(result==='error')toast('No se pudo generar el archivo');
}
function restoreFromFile(file){
  const reader=new FileReader();
  reader.onload=async()=>{
    let data;
    try{data=JSON.parse(reader.result)}catch(e){toast('El archivo no es un respaldo válido');return}
    if(!data||!Array.isArray(data.clients)||!Array.isArray(data.sessions)){toast('El archivo no es un respaldo válido');return}
    confirmDlg('Esto reemplaza todos los datos actuales (incluidas las fotos) por los del archivo.','Restaurar',async()=>{
      db=normalize({clients:data.clients,sessions:data.sessions,measures:data.measures,exercises:data.exercises,cycles:data.cycles,wellness:data.wellness,settings:data.settings,draft:null,lastBackup:Date.now()});
      save();
      try{await clearAllPhotos()}catch(e){}
      photoCache={};
      if(Array.isArray(data.photos)&&data.photos.length){
        try{await Promise.all(data.photos.map(p=>savePhoto(p)))}catch(e){}
      }
      ui.tab='inicio';ui.clientOpen=false;render(true);toast('Datos y fotos restaurados');
    });
  };
  reader.readAsText(file);
}

/* ---------- service worker (offline) ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}

render(true);
</script>
